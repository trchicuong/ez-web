<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/main :: layout('Đăng ký', ~{::#content})}"
>
  <body>
    <div id="content">
      <div class="min-h-[calc(100vh-113px)] flex items-center justify-center py-8 px-4">
        <div class="w-full max-w-md">
          <div class="text-center mb-6">
            <a th:href="@{/}" class="inline-flex items-center gap-2">
              <i class="ph ph-storefront text-blue-600 text-3xl"></i>
              <span class="text-xl font-bold text-gray-900 dark:text-white">EZWeb Store</span>
            </a>
            <h1 class="mt-3 text-2xl font-bold text-gray-900 dark:text-white">Đăng ký</h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Tạo tài khoản miễn phí!</p>
          </div>

          <div
            class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6"
          >
            <form th:action="@{/register}" method="post" th:object="${user}" class="space-y-4">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <div>
                <label
                  for="name"
                  class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
                  >Họ và tên</label
                >
                <input
                  type="text"
                  id="name"
                  th:field="*{name}"
                  required
                  placeholder="Nguyễn Văn A"
                  class="w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                />
                <span
                  th:if="${#fields.hasErrors('name')}"
                  th:errors="*{name}"
                  class="text-xs text-red-500 mt-1 block"
                ></span>
              </div>
              <div>
                <label
                  for="email"
                  class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
                  >Email</label
                >
                <input
                  type="email"
                  id="email"
                  th:field="*{email}"
                  required
                  placeholder="ban@example.com"
                  class="w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                />
                <span
                  th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"
                  class="text-xs text-red-500 mt-1 block"
                ></span>
              </div>
              <div>
                <label
                  for="password"
                  class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
                  >Mật khẩu</label
                >
                <input
                  type="password"
                  id="password"
                  th:field="*{password}"
                  required
                  placeholder="••••••••"
                  minlength="6"
                  class="w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                />
                <span
                  th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}"
                  class="text-xs text-red-500 mt-1 block"
                ></span>
              </div>
              <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl py-2.5 text-sm transition-colors"
              >
                Tạo tài khoản
              </button>
            </form>
          </div>

          <p class="mt-4 text-center text-sm text-gray-500 dark:text-gray-400">
            Đã có tài khoản?
            <a th:href="@{/login}" class="text-blue-600 font-medium hover:underline">Đăng nhập</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>

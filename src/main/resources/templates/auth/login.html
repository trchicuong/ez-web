<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/main :: layout('Đăng nhập', ~{::#content})}"
>
  <body>
    <div id="content">
      <div class="min-h-[calc(100vh-113px)] flex items-center justify-center py-8 px-4">
        <div class="w-full max-w-md">
          <div class="text-center mb-6">
            <a th:href="@{/}" class="inline-flex items-center gap-2">
              <i class="ph ph-storefront text-blue-600 text-3xl"></i>
              <span class="text-xl font-bold text-gray-900 dark:text-white">EZWeb Store</span>
            </a>
            <h1 class="mt-3 text-2xl font-bold text-gray-900 dark:text-white">Đăng nhập</h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Chào mừng bạn trở lại!</p>
          </div>

          <div
            th:if="${param.error}"
            class="mb-4 px-4 py-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-400 rounded-xl text-sm"
          >
            Email hoặc mật khẩu không đúng.
          </div>
          <div
            th:if="${param.logout}"
            class="mb-4 px-4 py-3 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 text-green-700 dark:text-green-400 rounded-xl text-sm"
          >
            Đăng xuất thành công!
          </div>

          <div
            class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6"
          >
            <form th:action="@{/login}" method="post" class="space-y-4">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <div>
                <label
                  for="username"
                  class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
                  >Email</label
                >
                <input
                  type="email"
                  id="username"
                  name="username"
                  required
                  placeholder="ban@example.com"
                  class="w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white px-4 py-2.5 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                />
              </div>
              <div>
                <label
                  for="password"
                  class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
                  >Mật khẩu</label
                >
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  placeholder="••••••••"
                  class="w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white px-4 py-2.5 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                />
              </div>
              <div class="flex items-center gap-2">
                <input type="checkbox" id="remember-me" name="remember-me" class="rounded" />
                <label for="remember-me" class="text-sm text-gray-600 dark:text-gray-400"
                  >Ghi nhớ đăng nhập</label
                >
              </div>
              <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl py-2.5 text-sm transition-colors"
              >
                Đăng nhập
              </button>
            </form>
          </div>

          <p class="mt-4 text-center text-sm text-gray-500 dark:text-gray-400">
            Chưa có tài khoản?
            <a th:href="@{/register}" class="text-blue-600 font-medium hover:underline"
              >Đăng ký ngay</a
            >
          </p>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/admin :: adminLayout(${pageTitle ?: 'Chỉnh sửa người dùng'}, ~{::#content})}"
>
  <body>
    <div id="content">
      <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="flex items-center gap-3 mb-6">
          <a
            th:href="@{/admin/users/{id}(id=${user.id})}"
            class="text-gray-400 hover:text-gray-700 transition-colors"
          >
            <i class="ph ph-arrow-left text-xl"></i>
          </a>
          <div>
            <h1 class="font-semibold text-gray-900">Chỉnh sửa người dùng</h1>
            <p class="text-xs text-gray-400 mt-0.5">
              <span th:text="${user.email}">email</span> · ID <span th:text="${user.id}">0</span>
            </p>
          </div>
        </div>

        <form th:action="@{/admin/users/{id}(id=${user.id})}" method="post" class="space-y-5">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <!-- Basic info -->
          <div class="rounded-xl bg-white border border-gray-100 shadow-sm p-5">
            <h2 class="text-sm font-medium text-gray-700 mb-4">Thông tin cơ bản</h2>
            <div class="space-y-4">
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5" for="name">
                  Họ tên <span class="text-red-500">*</span>
                </label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  required
                  th:value="${user.name}"
                  class="w-full rounded-lg border border-gray-200 px-3 py-2.5 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition"
                />
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5" for="email">
                  Email <span class="text-red-500">*</span>
                </label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  th:value="${user.email}"
                  class="w-full rounded-lg border border-gray-200 px-3 py-2.5 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition"
                />
              </div>
            </div>
          </div>

          <!-- Role & Balance -->
          <div class="rounded-xl bg-white border border-gray-100 shadow-sm p-5">
            <h2 class="text-sm font-medium text-gray-700 mb-4">Quyền hạn & số dư</h2>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5" for="role"
                  >Vai trò</label
                >
                <select
                  id="role"
                  name="role"
                  th:disabled="${isOwnAccount}"
                  th:classappend="${isOwnAccount ? ' bg-gray-50 cursor-not-allowed' : ''}"
                  class="w-full rounded-lg border border-gray-200 px-3 py-2.5 text-sm focus:border-indigo-400 outline-none transition"
                >
                  <option value="USER" th:selected="${user.role == 'USER'}">Customer</option>
                  <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">Admin</option>
                </select>
                <p th:if="${isOwnAccount}" class="text-xs text-amber-600 mt-1">
                  <i class="ph ph-lock"></i> Không thể thay đổi vai trò của chính mình
                </p>
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5" for="balance">
                  Số dư ví (VNĐ)
                </label>
                <input
                  type="number"
                  id="balance"
                  name="balance"
                  min="0"
                  step="1000"
                  th:value="${user.balance}"
                  class="w-full rounded-lg border border-gray-200 px-3 py-2.5 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition"
                />
                <p class="text-xs text-gray-400 mt-1">Nhập giá trị tuyệt đối (không cộng/trừ)</p>
              </div>
            </div>
          </div>

          <!-- Password reset -->
          <div class="rounded-xl bg-white border border-gray-100 shadow-sm p-5">
            <h2 class="text-sm font-medium text-gray-700 mb-1">Đặt lại mật khẩu</h2>
            <p class="text-xs text-gray-400 mb-4">
              Để trống nếu không muốn thay đổi mật khẩu. Tối thiểu 8 ký tự.
            </p>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1.5" for="newPassword">
                Mật khẩu mới
              </label>
              <input
                type="password"
                id="newPassword"
                name="newPassword"
                minlength="8"
                placeholder="Nhập mật khẩu mới (tùy chọn)..."
                autocomplete="new-password"
                class="w-full rounded-lg border border-gray-200 px-3 py-2.5 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition"
              />
            </div>
          </div>

          <div class="flex gap-3">
            <button
              type="submit"
              class="flex-1 rounded-lg bg-indigo-600 text-white py-2.5 text-sm font-medium hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2"
            >
              <i class="ph ph-floppy-disk"></i> Lưu thay đổi
            </button>
            <a
              th:href="@{/admin/users/{id}(id=${user.id})}"
              class="flex-1 rounded-lg border border-gray-200 text-gray-600 py-2.5 text-sm hover:bg-gray-50 transition-colors text-center flex items-center justify-center"
            >
              Hủy
            </a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  th:replace="~{layout/admin :: adminLayout('Người dùng', ~{::#content})}"
>
  <body>
    <div id="content">
      <div class="flex items-center justify-between mb-5">
        <p class="text-sm text-gray-500">
          Tổng: <strong class="text-gray-800" th:text="${users.totalElements}">0</strong> người dùng
        </p>
      </div>
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-xs text-gray-400 uppercase border-b border-gray-100">
              <tr>
                <th class="px-5 py-3 text-left w-14">ID</th>
                <th class="px-5 py-3 text-left">Tên</th>
                <th class="px-5 py-3 text-left">Email</th>
                <th class="px-5 py-3 text-right">Số dư</th>
                <th class="px-5 py-3 text-center">Role</th>
                <th class="px-5 py-3 text-left">Ngày tạo</th>
                <th class="px-5 py-3 text-center w-44">Đổi role</th>
                <th class="px-5 py-3 text-center w-16">Chi tiết</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
              <tr
                th:each="u : ${users.content}"
                class="hover:bg-gray-50/60 transition-colors"
                th:classappend="${#authentication.name == u.email} ? ' bg-indigo-50/30'"
              >
                <td class="px-5 py-3 font-mono text-gray-400 text-xs" th:text="${u.id}">1</td>
                <td class="px-5 py-3">
                  <div class="flex items-center gap-2.5">
                    <div
                      class="size-8 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white font-bold text-xs flex-shrink-0"
                      th:text="${#strings.toUpperCase(#strings.substring(u.name, 0, 1))}"
                    >
                      U
                    </div>
                    <span class="font-medium text-gray-800" th:text="${u.name}">Name</span>
                    <span
                      th:if="${#authentication.name == u.email}"
                      class="text-xs bg-indigo-100 text-indigo-600 rounded-full px-1.5 py-0.5"
                      >bạn</span
                    >
                  </div>
                </td>
                <td class="px-5 py-3 text-gray-500 text-xs" th:text="${u.email}">email</td>
                <td
                  class="px-5 py-3 text-right font-medium text-xs"
                  th:text="${#numbers.formatInteger(u.balance, 0, 'COMMA') + 'đ'}"
                >
                  0đ
                </td>
                <td class="px-5 py-3 text-center">
                  <span
                    class="inline-block rounded-full px-2 py-0.5 text-xs font-medium"
                    th:classappend="${u.role == 'ADMIN'} ? ' bg-red-100 text-red-700' : ' bg-gray-100 text-gray-500'"
                    th:text="${u.role}"
                    >USER</span
                  >
                </td>
                <td
                  class="px-5 py-3 text-xs text-gray-400"
                  th:text="${#temporals.format(u.createdAt, 'dd/MM/yyyy')}"
                ></td>
                <td class="px-5 py-3">
                  <div th:if="${#authentication.name != u.email}">
                    <form
                      th:action="@{/admin/users/{id}/role(id=${u.id})}"
                      method="POST"
                      class="flex items-center gap-1"
                    >
                      <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                      />
                      <select
                        name="role"
                        class="flex-1 rounded border border-gray-200 px-2 py-1 text-xs bg-white focus:border-indigo-400 outline-none"
                      >
                        <option value="CUSTOMER" th:selected="${u.role == 'CUSTOMER'}">
                          Customer
                        </option>
                        <option value="ADMIN" th:selected="${u.role == 'ADMIN'}">Admin</option>
                      </select>
                      <button
                        type="submit"
                        class="rounded p-1 text-gray-400 hover:bg-indigo-50 hover:text-indigo-600 transition-colors"
                        title="Lưu"
                      >
                        <i class="ph ph-check text-base"></i>
                      </button>
                    </form>
                  </div>
                  <span
                    th:unless="${#authentication.name != u.email}"
                    class="text-xs text-gray-300 px-2"
                    >—</span
                  >
                </td>
                <td class="px-5 py-3 text-center">
                  <a
                    th:href="@{/admin/users/{id}(id=${u.id})}"
                    title="Xem chi tiết"
                    class="inline-flex items-center justify-center w-7 h-7 rounded hover:bg-indigo-50 text-gray-400 hover:text-indigo-600 transition-colors"
                  >
                    <i class="ph ph-eye text-base"></i>
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <!-- Pagination -->
        <div
          th:if="${users.totalPages > 1}"
          class="flex items-center justify-between border-t border-gray-100 px-5 py-3 text-sm text-gray-500"
        >
          <span
            th:text="${users.number * users.size + 1} + '–' + ${T(java.lang.Math).min((users.number + 1) * users.size, users.totalElements)} + ' / ' + ${users.totalElements}"
          ></span>
          <div class="flex gap-1">
            <a
              th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
              th:href="@{/admin/users(page=${i})}"
              class="px-3 py-1 rounded text-xs"
              th:classappend="${i == users.number} ? ' bg-indigo-600 text-white' : ' hover:bg-gray-100'"
              th:text="${i + 1}"
              >1</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/admin :: adminLayout('Chi tiết: ' + ${user.name}, ~{::#content})}"
>
  <body>
    <div id="content">
      <div class="max-w-xl">
        <a
          th:href="@{/admin/users}"
          class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-blue-600 mb-4"
        >
          <i class="ph ph-arrow-left text-sm"></i> Quay lại
        </a>

        <div class="bg-white rounded-2xl border border-gray-200 p-6">
          <div class="flex items-center gap-4 mb-6">
            <span
              class="w-14 h-14 rounded-full bg-blue-600 flex items-center justify-center text-white text-xl font-bold"
              th:text="${#strings.toUpperCase(#strings.substring(user.name, 0, 1))}"
              >U</span
            >
            <div>
              <h2 class="text-lg font-bold text-gray-900" th:text="${user.name}">Name</h2>
              <p class="text-sm text-gray-400" th:text="${user.email}">email</p>
            </div>
            <span
              class="ml-auto px-3 py-1 text-xs font-semibold rounded-full"
              th:classappend="${user.role == 'ADMIN'} ? ' bg-red-100 text-red-600' : ' bg-blue-100 text-blue-600'"
              th:text="${user.role}"
              >USER</span
            >
          </div>

          <dl class="space-y-3 text-sm mb-6">
            <div class="flex justify-between py-2 border-b border-gray-50">
              <dt class="text-gray-500">Số dư</dt>
              <dd
                class="font-semibold text-green-600"
                th:text="${#numbers.formatInteger(user.balance, 0, 'COMMA') + 'đ'}"
              >
                0đ
              </dd>
            </div>
            <div class="flex justify-between py-2 border-b border-gray-50">
              <dt class="text-gray-500">Ngày tạo</dt>
              <dd
                class="text-gray-700"
                th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}"
              ></dd>
            </div>
          </dl>

          <form
            th:action="@{/admin/users/{id}/role(id=${user.id})}"
            method="post"
            class="flex items-end gap-3"
          >
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="flex-1">
              <label class="block text-xs font-medium text-gray-600 mb-1.5">Thay đổi vai trò</label>
              <select
                name="role"
                class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="USER" th:selected="${user.role == 'USER'}">USER</option>
                <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
              </select>
            </div>
            <button
              type="submit"
              class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl transition-colors"
            >
              Lưu
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/admin :: adminLayout('Đơn hàng', ~{::#content})}"
>
  <body>
    <div id="content">
      <!-- Status filter tabs -->
      <div class="flex flex-wrap items-center gap-2 mb-5">
        <a
          th:href="@{/admin/orders}"
          class="rounded-full px-4 py-1.5 text-xs font-medium border transition-colors"
          th:classappend="${status == ''} ? ' bg-indigo-600 text-white border-indigo-600' : ' bg-white text-gray-600 border-gray-200 hover:border-indigo-400 hover:text-indigo-600'"
        >
          Tất cả
        </a>
        <a
          th:href="@{/admin/orders(status='completed')}"
          class="rounded-full px-4 py-1.5 text-xs font-medium border transition-colors"
          th:classappend="${status == 'completed'} ? ' bg-indigo-600 text-white border-indigo-600' : ' bg-white text-gray-600 border-gray-200 hover:border-indigo-400 hover:text-indigo-600'"
        >
          Hoàn thành
        </a>
        <a
          th:href="@{/admin/orders(status='pending')}"
          class="rounded-full px-4 py-1.5 text-xs font-medium border transition-colors"
          th:classappend="${status == 'pending'} ? ' bg-indigo-600 text-white border-indigo-600' : ' bg-white text-gray-600 border-gray-200 hover:border-indigo-400 hover:text-indigo-600'"
        >
          Chờ xử lý
        </a>
        <a
          th:href="@{/admin/orders(status='cancelled')}"
          class="rounded-full px-4 py-1.5 text-xs font-medium border transition-colors"
          th:classappend="${status == 'cancelled'} ? ' bg-indigo-600 text-white border-indigo-600' : ' bg-white text-gray-600 border-gray-200 hover:border-indigo-400 hover:text-indigo-600'"
        >
          Đã hủy
        </a>
        <a
          th:href="@{/admin/orders(status='refunded')}"
          class="rounded-full px-4 py-1.5 text-xs font-medium border transition-colors"
          th:classappend="${status == 'refunded'} ? ' bg-indigo-600 text-white border-indigo-600' : ' bg-white text-gray-600 border-gray-200 hover:border-indigo-400 hover:text-indigo-600'"
        >
          Hoàn tiền
        </a>
        <span
          class="ml-auto text-xs text-gray-400"
          th:text="${orders.totalElements} + ' đơn hàng'"
        ></span>
      </div>

      <!-- Table -->
      <div class="rounded-xl bg-white border border-gray-100 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-xs text-gray-400 uppercase border-b border-gray-100">
              <tr>
                <th class="px-5 py-3 text-left w-14">ID</th>
                <th class="px-5 py-3 text-left">Khách hàng</th>
                <th class="px-5 py-3 text-right">Tổng tiền</th>
                <th class="px-5 py-3 text-center">SP</th>
                <th class="px-5 py-3 text-center">Trạng thái</th>
                <th class="px-5 py-3 text-left">Ngày tạo</th>
                <th class="px-5 py-3 text-center w-44">Đổi trạng thái</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
              <tr th:each="order : ${orders.content}" class="hover:bg-gray-50/60 transition-colors">
                <td
                  class="px-5 py-3 font-mono text-gray-400 text-xs"
                  th:text="'#' + ${order.id}"
                ></td>
                <td class="px-5 py-3">
                  <p class="font-medium text-gray-800 text-xs" th:text="${order.user?.name}"></p>
                  <p class="text-gray-400 text-xs" th:text="${order.user?.email}"></p>
                </td>
                <td
                  class="px-5 py-3 text-right font-medium text-xs"
                  th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA') + 'đ'}"
                >
                  0đ
                </td>
                <td
                  class="px-5 py-3 text-center text-gray-500 text-xs"
                  th:text="${#lists.size(order.items)}"
                >
                  0
                </td>
                <td class="px-5 py-3 text-center">
                  <span
                    class="inline-block rounded-full px-2 py-0.5 text-xs font-medium"
                    th:classappend="${order.status == 'completed'} ? ' bg-green-100 text-green-800' :
                                        (${order.status == 'cancelled'} ? ' bg-gray-100 text-gray-500' :
                                        (${order.status == 'refunded'} ? ' bg-red-100 text-red-800' : ' bg-yellow-100 text-yellow-800'))"
                    th:text="${order.status == 'completed'} ? 'Hoàn thành' :
                                  (${order.status == 'cancelled'} ? 'Đã hủy' :
                                  (${order.status == 'refunded'} ? 'Hoàn tiền' : 'Chờ xử lý'))"
                  >
                    Status
                  </span>
                </td>
                <td
                  class="px-5 py-3 text-xs text-gray-500"
                  th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"
                ></td>
                <td class="px-5 py-3">
                  <form
                    th:action="@{/admin/orders/{id}/status(id=${order.id})}"
                    method="post"
                    class="flex items-center gap-1"
                  >
                    <input
                      type="hidden"
                      th:name="${_csrf.parameterName}"
                      th:value="${_csrf.token}"
                    />
                    <select
                      name="status"
                      class="flex-1 rounded border border-gray-200 px-2 py-1 text-xs bg-white focus:border-indigo-400 outline-none"
                    >
                      <option value="pending" th:selected="${order.status == 'pending'}">
                        Chờ xử lý
                      </option>
                      <option value="completed" th:selected="${order.status == 'completed'}">
                        Hoàn thành
                      </option>
                      <option value="cancelled" th:selected="${order.status == 'cancelled'}">
                        Đã hủy
                      </option>
                      <option value="refunded" th:selected="${order.status == 'refunded'}">
                        Hoàn tiền
                      </option>
                    </select>
                    <button
                      type="submit"
                      class="rounded p-1 text-gray-400 hover:bg-indigo-50 hover:text-indigo-600 transition-colors"
                      title="Lưu"
                    >
                      <i class="ph ph-check text-base"></i>
                    </button>
                  </form>
                </td>
              </tr>
              <tr th:if="${orders.isEmpty()}">
                <td colspan="7" class="px-5 py-10 text-center text-gray-400 text-sm">
                  Không có đơn hàng nào
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div
          th:if="${orders.totalPages > 1}"
          class="flex items-center justify-between border-t border-gray-100 px-5 py-3 text-sm text-gray-500"
        >
          <span
            th:text="${orders.number * orders.size + 1} + '–' + ${T(java.lang.Math).min((orders.number + 1) * orders.size, orders.totalElements)} + ' / ' + ${orders.totalElements}"
          ></span>
          <div class="flex gap-1">
            <a
              th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
              th:href="@{/admin/orders(page=${i}, status=${status})}"
              class="px-3 py-1 rounded text-xs"
              th:classappend="${i == orders.number} ? ' bg-indigo-600 text-white' : ' hover:bg-gray-100'"
              th:text="${i + 1}"
              >1</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

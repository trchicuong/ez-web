<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  th:fragment="adminLayout(title, content)"
  class="h-full"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title} + ' — Admin · EZWeb'">Admin · EZWeb</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}" />
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32x32.png}" />
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/images/apple-touch-icon.png}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:inline="none">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                800: '#1e293b',
                900: '#0f172a',
              },
            },
          },
        },
      };
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
    <style>
      #adminSidebar {
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
  </head>
  <body class="h-full bg-gray-100">
    <div
      id="sidebarOverlay"
      class="fixed inset-0 z-30 bg-black/50 lg:hidden hidden"
      onclick="closeSidebar()"
    ></div>

    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar -->
      <aside
        id="adminSidebar"
        class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col bg-gray-900 overflow-y-auto -translate-x-full lg:static lg:translate-x-0 lg:w-60 lg:flex-shrink-0"
      >
        <div class="flex h-16 items-center px-5 border-b border-gray-700 flex-shrink-0">
          <a th:href="@{/admin}" class="flex items-center gap-2 flex-1">
            <span class="size-7 rounded-lg bg-indigo-600 flex items-center justify-center">
              <i class="ph ph-storefront text-white text-sm"></i>
            </span>
            <span class="font-bold text-white text-sm">Admin Panel</span>
          </a>
          <button
            onclick="closeSidebar()"
            class="lg:hidden text-gray-400 hover:text-white p-1 rounded"
          >
            <i class="ph ph-x text-lg"></i>
          </button>
        </div>

        <nav class="flex-1 px-3 py-4 space-y-0.5">
          <a
            th:href="@{/admin}"
            class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium transition-colors text-gray-300 hover:bg-gray-700 hover:text-white"
          >
            <i class="ph ph-squares-four text-base flex-shrink-0"></i> Dashboard
          </a>
          <a
            th:href="@{/admin/products}"
            class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium transition-colors text-gray-300 hover:bg-gray-700 hover:text-white"
          >
            <i class="ph ph-package text-base flex-shrink-0"></i> Sản phẩm
          </a>
          <a
            th:href="@{/admin/categories}"
            class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium transition-colors text-gray-300 hover:bg-gray-700 hover:text-white"
          >
            <i class="ph ph-tag text-base flex-shrink-0"></i> Danh mục
          </a>
          <a
            th:href="@{/admin/orders}"
            class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium transition-colors text-gray-300 hover:bg-gray-700 hover:text-white"
          >
            <i class="ph ph-receipt text-base flex-shrink-0"></i> Đơn hàng
          </a>
          <a
            th:href="@{/admin/topups}"
            class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium transition-colors text-gray-300 hover:bg-gray-700 hover:text-white"
          >
            <i class="ph ph-wallet text-base flex-shrink-0"></i> Nạp tiền
          </a>
          <a
            th:href="@{/admin/users}"
            class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium transition-colors text-gray-300 hover:bg-gray-700 hover:text-white"
          >
            <i class="ph ph-users text-base flex-shrink-0"></i> Người dùng
          </a>
        </nav>

        <div class="px-3 pb-4 border-t border-gray-700 pt-3">
          <a
            th:href="@{/}"
            class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-gray-400 hover:bg-gray-700 hover:text-white transition-colors"
          >
            <i class="ph ph-storefront text-base flex-shrink-0"></i> Về cửa hàng
          </a>
          <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button
              type="submit"
              class="w-full flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-red-400 hover:bg-red-900/30 hover:text-red-300 transition-colors"
            >
              <i class="ph ph-sign-out text-base flex-shrink-0"></i> Đăng xuất
            </button>
          </form>
        </div>
      </aside>

      <!-- Main -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Topbar -->
        <header
          class="flex-shrink-0 h-16 bg-white border-b border-gray-200 flex items-center px-4 lg:px-6 gap-4"
        >
          <button
            onclick="openSidebar()"
            class="lg:hidden text-gray-500 hover:text-gray-700 p-2 rounded-lg hover:bg-gray-100"
          >
            <i class="ph ph-list text-xl"></i>
          </button>
          <h1 class="text-base font-semibold text-gray-900 flex-1" th:text="${title}">Admin</h1>
          <span class="text-xs text-gray-400 hidden sm:block" sec:authentication="name">admin</span>
        </header>

        <!-- Content -->
        <main class="flex-1 overflow-y-auto p-4 lg:p-6">
          <!-- Flash messages -->
          <div
            th:if="${successMessage}"
            class="mb-4 px-4 py-3 bg-green-50 border border-green-200 text-green-700 rounded-xl text-sm"
            th:text="${successMessage}"
          ></div>
          <div
            th:if="${errorMessage}"
            class="mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm"
            th:text="${errorMessage}"
          ></div>

          <th:block th:insert="${content}"></th:block>
        </main>
      </div>
    </div>

    <script>
      function openSidebar() {
        document.getElementById('adminSidebar').classList.remove('-translate-x-full');
        document.getElementById('sidebarOverlay').classList.remove('hidden');
      }
      function closeSidebar() {
        document.getElementById('adminSidebar').classList.add('-translate-x-full');
        document.getElementById('sidebarOverlay').classList.add('hidden');
      }
    </script>
    <script th:src="@{/js/admin.js}"></script>
  </body>
</html>

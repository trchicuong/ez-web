<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/main :: layout(${pageTitle ?: 'Sản phẩm'}, ~{::#content})}"
>
  <body>
    <div id="content">
      <!-- Page header + filter tabs -->
      <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h1
            class="text-xl font-bold text-gray-900 dark:text-white"
            th:text="${pageTitle ?: 'Sản phẩm'}"
          >
            Sản phẩm
          </h1>
          <p
            class="text-sm text-gray-400 dark:text-gray-500 mt-0.5"
            th:text="${products.totalElements} + ' sản phẩm'"
          >
            0 sản phẩm
          </p>
        </div>
        <div
          class="flex items-center gap-1.5 bg-gray-100 dark:bg-gray-800 rounded-xl p-1 self-start sm:self-auto"
        >
          <a
            th:href="@{/products(category=${activeCategory})}"
            th:classappend="${!activeSale and !activeFree and !activeLatest ? ' bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm' : ' text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white'}"
            class="px-3 py-1.5 text-xs font-medium rounded-lg transition-colors"
          >
            Tất cả
          </a>
          <a
            th:href="@{/products(category=${activeCategory}, latest=)}"
            th:classappend="${activeLatest ? ' bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm' : ' text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white'}"
            class="px-3 py-1.5 text-xs font-medium rounded-lg transition-colors"
          >
            Mới nhất
          </a>
          <a
            th:href="@{/products(category=${activeCategory}, sale=)}"
            th:classappend="${activeSale ? ' bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm' : ' text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white'}"
            class="px-3 py-1.5 text-xs font-medium rounded-lg transition-colors"
          >
            Giảm giá
          </a>
          <a
            th:href="@{/products(category=${activeCategory}, free=)}"
            th:classappend="${activeFree ? ' bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm' : ' text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white'}"
            class="px-3 py-1.5 text-xs font-medium rounded-lg transition-colors"
          >
            Miễn phí
          </a>
        </div>
      </div>

      <!-- Product grid -->
      <div
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mb-8"
        th:if="${not products.isEmpty()}"
      >
        <article
          th:each="p : ${products.content}"
          class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl shadow-sm overflow-hidden flex flex-col group hover:shadow-md hover:border-gray-200 dark:hover:border-gray-600 transition-all duration-200"
        >
          <a
            th:href="@{/product/{s}(s=${p.slug})}"
            class="block relative overflow-hidden bg-gray-50 aspect-video"
          >
            <img
              th:src="${p.thumbnail}"
              th:alt="${p.title}"
              loading="lazy"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
              onerror="
                this.onerror = null;
                this.src = '/images/placeholder.png';
              "
            />
            <span
              th:if="${p.onSale}"
              class="absolute top-2.5 left-2.5 px-2 py-0.5 bg-red-500 text-white text-xs font-semibold rounded-md"
              th:text="'-' + ${(p.price - p.salePrice) * 100 / p.price} + '%'"
              >-0%</span
            >
            <span
              class="absolute top-2.5 right-2.5 px-2 py-0.5 bg-white/90 dark:bg-gray-800/90 text-gray-600 dark:text-gray-300 text-xs font-medium rounded-md border border-gray-100 dark:border-gray-600"
              th:text="${p.category?.name}"
              >Cat</span
            >
          </a>
          <div class="flex flex-col flex-1 p-3.5">
            <a
              th:href="@{/product/{s}(s=${p.slug})}"
              class="text-[13px] font-semibold text-gray-900 dark:text-white leading-snug mb-1.5 hover:text-blue-600 transition-colors line-clamp-2"
              th:text="${p.title}"
              >Title</a
            >
            <p
              class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed mb-2 line-clamp-2 flex-1"
              th:text="${p.summary}"
            ></p>
            <div class="flex flex-wrap gap-1 mb-2" th:if="${not #lists.isEmpty(p.tags)}">
              <span
                th:each="tag : ${p.tags}"
                class="px-2 py-0.5 bg-blue-50 text-blue-600 text-xs font-medium rounded"
                th:text="${tag}"
                >tag</span
              >
            </div>
            <div
              class="flex items-center justify-between mt-auto pt-2 border-t border-gray-50 dark:border-gray-700"
            >
              <div>
                <span
                  th:if="${p.onSale}"
                  class="text-sm font-bold text-red-600"
                  th:text="${#numbers.formatInteger(p.salePrice, 0, 'COMMA') + 'đ'}"
                  >0đ</span
                >
                <span
                  th:if="${p.onSale}"
                  class="text-xs text-gray-400 line-through ml-1"
                  th:text="${#numbers.formatInteger(p.price, 0, 'COMMA') + 'đ'}"
                ></span>
                <span
                  th:unless="${p.onSale}"
                  class="text-sm font-bold text-gray-900 dark:text-white"
                  th:text="${p.price == 0 ? 'Miễn phí' : #numbers.formatInteger(p.price, 0, 'COMMA') + 'đ'}"
                  >0đ</span
                >
              </div>
              <a
                th:href="@{/product/{s}(s=${p.slug})}"
                class="text-xs text-blue-600 hover:text-blue-700 font-medium flex items-center gap-0.5"
              >
                Chi tiết <i class="ph ph-arrow-right text-xs"></i>
              </a>
            </div>
          </div>
        </article>
      </div>

      <!-- Empty state -->
      <div
        th:if="${products.isEmpty()}"
        class="text-center py-20 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-sm"
      >
        <i class="ph ph-package text-5xl text-gray-200 dark:text-gray-700 mb-3 block"></i>
        <p class="text-sm text-gray-400 dark:text-gray-500 font-medium">Không có sản phẩm nào.</p>
      </div>

      <!-- Pagination -->
      <div class="flex items-center justify-center gap-1.5 mt-6" th:if="${products.totalPages > 1}">
        <a
          th:href="@{/products(category=${activeCategory}, latest=${activeLatest ? '' : null}, sale=${activeSale ? '' : null}, free=${activeFree ? '' : null}, page=${products.number - 1})}"
          class="w-9 h-9 flex items-center justify-center rounded-xl border border-gray-200 dark:border-gray-700 text-gray-500 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 transition-colors"
          th:classappend="${products.first ? ' opacity-40 pointer-events-none' : ''}"
        >
          <i class="ph ph-caret-left text-sm"></i>
        </a>
        <a
          th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
          th:href="@{/products(category=${activeCategory}, latest=${activeLatest ? '' : null}, sale=${activeSale ? '' : null}, free=${activeFree ? '' : null}, page=${i})}"
          class="w-9 h-9 flex items-center justify-center rounded-xl border text-sm font-medium transition-colors"
          th:classappend="${i == products.number ? ' bg-blue-600 text-white border-blue-600' : ' border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200'}"
          th:text="${i + 1}"
          >1</a
        >
        <a
          th:href="@{/products(category=${activeCategory}, latest=${activeLatest ? '' : null}, sale=${activeSale ? '' : null}, free=${activeFree ? '' : null}, page=${products.number + 1})}"
          class="w-9 h-9 flex items-center justify-center rounded-xl border border-gray-200 dark:border-gray-700 text-gray-500 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 transition-colors"
          th:classappend="${products.last ? ' opacity-40 pointer-events-none' : ''}"
        >
          <i class="ph ph-caret-right text-sm"></i>
        </a>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  th:replace="~{layout/main :: layout('Giỏ hàng', ~{::#content})}"
>
  <body>
    <div id="content">
      <div class="max-w-3xl mx-auto py-4">
        <div class="flex items-center justify-between mb-6">
          <h1 class="text-xl font-bold text-gray-900 dark:text-white">Giỏ hàng</h1>
          <span class="text-sm text-gray-400" th:text="${cartCount} + ' sản phẩm'">0 sản phẩm</span>
        </div>

        <!-- Empty -->
        <div
          th:if="${#lists.isEmpty(cart)}"
          class="text-center py-16 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-sm"
        >
          <i
            class="ph ph-shopping-cart-simple text-5xl text-gray-200 dark:text-gray-700 mb-3 block"
          ></i>
          <p class="text-sm text-gray-400 font-medium mb-4">Giỏ hàng trống!</p>
          <a
            th:href="@{/products}"
            class="inline-flex items-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl transition-colors"
          >
            <i class="ph ph-storefront text-base"></i> Khám phá sản phẩm
          </a>
        </div>

        <div th:if="${not #lists.isEmpty(cart)}">
          <!-- Items -->
          <div class="space-y-3 mb-6">
            <div
              th:each="item : ${cart}"
              class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-sm p-4 flex items-center gap-4"
            >
              <a th:href="@{/product/{s}(s=${item.slug})}">
                <img
                  th:src="${item.thumbnail}"
                  th:alt="${item.title}"
                  class="w-16 h-16 object-cover rounded-xl bg-gray-100 flex-shrink-0"
                  onerror="
                    this.onerror = null;
                    this.src = '/images/placeholder.png';
                  "
                  loading="lazy"
                />
              </a>
              <div class="flex-1 min-w-0">
                <a
                  th:href="@{/product/{s}(s=${item.slug})}"
                  class="text-sm font-semibold text-gray-900 dark:text-white hover:text-blue-600 transition-colors line-clamp-2"
                  th:text="${item.title}"
                  >Title</a
                >
                <div
                  class="text-sm font-bold text-blue-600 dark:text-blue-400 mt-1"
                  th:text="${#numbers.formatInteger(item.price, 0, 'COMMA') + 'đ'}"
                >
                  0đ
                </div>
              </div>
              <form th:action="@{/cart/remove/{id}(id=${item.productId})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button
                  type="submit"
                  class="w-9 h-9 flex items-center justify-center rounded-xl border border-gray-200 dark:border-gray-700 text-gray-400 hover:text-red-500 hover:border-red-200 transition-colors"
                >
                  <i class="ph ph-trash text-base"></i>
                </button>
              </form>
            </div>
          </div>

          <!-- Summary + checkout -->
          <div
            class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-sm p-5"
          >
            <div class="flex justify-between items-center mb-3 text-sm">
              <span class="text-gray-500 dark:text-gray-400">Tạm tính</span>
              <span
                class="font-semibold text-gray-900 dark:text-white"
                th:text="${#numbers.formatInteger(cartTotal, 0, 'COMMA') + 'đ'}"
                >0đ</span
              >
            </div>
            <div
              class="flex justify-between items-center mb-4 pb-4 border-b border-gray-100 dark:border-gray-700 text-sm"
            >
              <span class="text-gray-500 dark:text-gray-400">Số dư ví</span>
              <span
                class="font-semibold text-green-600"
                th:text="${#numbers.formatInteger(currentUser?.balance ?: 0, 0, 'COMMA') + 'đ'}"
                >0đ</span
              >
            </div>
            <div class="flex justify-between items-center mb-4 text-base font-bold">
              <span class="text-gray-900 dark:text-white">Tổng cộng</span>
              <span
                class="text-blue-600"
                th:text="${#numbers.formatInteger(cartTotal, 0, 'COMMA') + 'đ'}"
                >0đ</span
              >
            </div>
            <form th:action="@{/orders/checkout}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button
                type="submit"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors text-sm"
              >
                <i class="ph ph-lock-key text-base"></i> Thanh toán qua ví
              </button>
            </form>
            <a
              th:href="@{/topup}"
              class="mt-3 flex items-center justify-center gap-1.5 text-sm text-gray-500 hover:text-green-600 transition-colors"
            >
              <i class="ph ph-wallet text-base"></i> Nạp thêm tiền vào ví
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

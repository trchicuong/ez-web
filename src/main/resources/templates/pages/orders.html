<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/main :: layout('Đơn hàng của tôi', ~{::#content})}"
>
  <body>
    <div id="content">
      <div class="max-w-3xl mx-auto py-4">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-xl font-bold text-gray-900 dark:text-white">Đơn hàng của tôi</h1>
            <p
              class="text-sm text-gray-500 dark:text-gray-400 mt-0.5"
              th:text="${orders.totalElements} + ' đơn hàng'"
            >
              0 đơn hàng
            </p>
          </div>
          <a
            th:href="@{/products}"
            class="flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-xl transition-colors"
          >
            <i class="ph ph-storefront text-base"></i> Tiếp tục mua sắm
          </a>
        </div>

        <!-- Empty state -->
        <div
          th:if="${orders.isEmpty()}"
          class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-sm py-16 text-center"
        >
          <span
            class="inline-flex items-center justify-center w-16 h-16 bg-gray-50 dark:bg-gray-700 rounded-full mb-4"
          >
            <i class="ph ph-receipt text-gray-300 dark:text-gray-500 text-3xl"></i>
          </span>
          <h2 class="text-base font-semibold text-gray-900 dark:text-white mb-1">
            Chưa có đơn hàng nào
          </h2>
          <p class="text-sm text-gray-400 mb-5">Mua sản phẩm đầu tiên của bạn ngay!</p>
          <a
            th:href="@{/products}"
            class="inline-flex items-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl transition-colors"
          >
            <i class="ph ph-storefront text-base"></i> Khám phá sản phẩm
          </a>
        </div>

        <!-- Orders list -->
        <div th:if="${not orders.isEmpty()}" class="space-y-3">
          <div
            th:each="order : ${orders.content}"
            class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-sm hover:shadow-md transition-shadow"
          >
            <div class="flex items-center gap-4 p-4">
              <!-- Thumbnail of first item -->
              <a th:href="@{/orders/{id}(id=${order.id})}" class="flex-shrink-0">
                <img
                  th:if="${not #lists.isEmpty(order.items)}"
                  th:src="${order.items[0].product.thumbnail}"
                  th:alt="${order.items[0].product.title}"
                  class="w-14 h-14 object-cover rounded-xl bg-gray-100 dark:bg-gray-700"
                  onerror="
                    this.onerror = null;
                    this.src = '/images/placeholder.png';
                  "
                  loading="lazy"
                />
                <div
                  th:if="${#lists.isEmpty(order.items)}"
                  class="w-14 h-14 rounded-xl bg-gray-100 dark:bg-gray-700 flex items-center justify-center"
                >
                  <i class="ph ph-package text-gray-300 dark:text-gray-500 text-xl"></i>
                </div>
              </a>

              <!-- Info -->
              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">
                    <a
                      th:href="@{/orders/{id}(id=${order.id})}"
                      class="text-sm font-semibold text-gray-900 dark:text-white hover:text-blue-600 dark:hover:text-blue-400 transition-colors truncate block"
                      th:text="${not #lists.isEmpty(order.items)} ? ${order.items[0].product.title} : 'Đơn #' + ${order.id}"
                    >
                      Tên sản phẩm
                    </a>
                    <span
                      th:if="${#lists.size(order.items) > 1}"
                      class="text-xs text-gray-400"
                      th:text="'+' + (${#lists.size(order.items)} - 1) + ' sản phẩm khác'"
                    ></span>
                  </div>
                  <!-- Status badge -->
                  <span
                    class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold flex-shrink-0"
                    th:classappend="${order.status == 'completed'} ? ' bg-green-100 text-green-700' :
                                        (${order.status == 'cancelled'} ? ' bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-400' :
                                        (${order.status == 'refunded'} ? ' bg-blue-100 text-blue-600' : ' bg-yellow-100 text-yellow-700'))"
                    th:text="${order.status == 'completed'} ? 'Hoàn thành' :
                                  (${order.status == 'cancelled'} ? 'Đã huỷ' :
                                  (${order.status == 'refunded'} ? 'Đã hoàn tiền' : 'Đang xử lý'))"
                  >
                    Status
                  </span>
                </div>
                <div class="flex items-center justify-between mt-1.5">
                  <div class="flex items-center gap-3 text-xs text-gray-400 dark:text-gray-500">
                    <span th:text="'#' + ${order.id}"></span>
                    <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy')}"></span>
                  </div>
                  <span
                    class="text-sm font-bold text-gray-900 dark:text-white"
                    th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA') + 'đ'}"
                    >0đ</span
                  >
                </div>
              </div>

              <!-- Arrow -->
              <a
                th:href="@{/orders/{id}(id=${order.id})}"
                class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-xl text-gray-300 dark:text-gray-600 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-colors"
              >
                <i class="ph ph-caret-right text-base"></i>
              </a>
            </div>
          </div>
        </div>

        <!-- Pagination -->
        <div class="flex items-center justify-center gap-1.5 mt-6" th:if="${orders.totalPages > 1}">
          <a
            th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
            th:href="@{/orders(page=${i})}"
            class="w-9 h-9 flex items-center justify-center rounded-xl border text-sm font-medium transition-colors"
            th:classappend="${i == orders.number} ? ' bg-blue-600 text-white border-blue-600' : ' border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:bg-blue-50 hover:text-blue-600'"
            th:text="${i + 1}"
            >1</a
          >
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/main :: layout(${pageTitle ?: 'Đơn hàng'}, ~{::#content})}"
>
  <body>
    <div id="content">
      <div class="max-w-xl mx-auto py-4">
        <!-- Success / status banner -->
        <div
          th:if="${order.status == 'completed'}"
          class="bg-green-50 dark:bg-green-900/20 border border-green-100 dark:border-green-800 rounded-2xl p-6 mb-5 text-center"
        >
          <span
            class="inline-flex items-center justify-center w-14 h-14 bg-green-100 dark:bg-green-800/40 rounded-full mb-3"
          >
            <i class="ph ph-check-circle text-green-600 text-3xl"></i>
          </span>
          <h1 class="text-xl font-bold text-gray-900 dark:text-white mb-1">Mua thành công!</h1>
          <p class="text-sm text-gray-500 dark:text-gray-400">
            Đơn hàng
            <span
              class="font-semibold text-gray-700 dark:text-gray-200"
              th:text="'#' + ${order.id}"
            ></span>
            đã được xác nhận. Tải file ngay bên dưới.
          </p>
        </div>

        <!-- Non-completed status banner -->
        <div
          th:unless="${order.status == 'completed'}"
          class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl p-5 mb-5 flex items-center gap-3"
        >
          <a
            th:href="@{/orders}"
            class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-400"
          >
            <i class="ph ph-arrow-left text-lg"></i>
          </a>
          <div class="flex-1">
            <h1
              class="text-lg font-bold text-gray-900 dark:text-white"
              th:text="'Đơn hàng #' + ${order.id}"
            >
              Đơn hàng
            </h1>
            <p
              class="text-xs text-gray-400"
              th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"
            ></p>
          </div>
          <span
            class="px-3 py-1 text-xs font-semibold rounded-full"
            th:classappend="${order.status == 'cancelled'} ? ' bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-400' :
                                (${order.status == 'refunded'} ? ' bg-blue-100 text-blue-600' : ' bg-yellow-100 text-yellow-700')"
            th:text="${order.status == 'cancelled'} ? 'Đã huỷ' :
                          (${order.status == 'refunded'} ? 'Đã hoàn tiền' : 'Đang xử lý')"
          >
            Status
          </span>
        </div>

        <!-- Product cards -->
        <div
          th:each="item : ${order.items}"
          class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-sm overflow-hidden mb-4"
        >
          <div class="flex items-start gap-4 p-5">
            <a th:href="@{/product/{s}(s=${item.product.slug})}">
              <img
                th:src="${item.product.thumbnail}"
                th:alt="${item.product.title}"
                class="w-20 h-20 object-cover rounded-xl bg-gray-100 dark:bg-gray-700 flex-shrink-0"
                onerror="
                  this.onerror = null;
                  this.src = '/images/placeholder.png';
                "
                loading="lazy"
              />
            </a>
            <div class="flex-1 min-w-0">
              <span
                class="text-xs text-gray-400 dark:text-gray-500"
                th:text="${item.product.category?.name}"
              ></span>
              <h2 class="text-sm font-semibold text-gray-900 dark:text-white leading-snug mt-0.5">
                <a
                  th:href="@{/product/{s}(s=${item.product.slug})}"
                  class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
                  th:text="${item.product.title}"
                  >Title</a
                >
              </h2>
              <p
                class="text-base font-bold text-blue-600 mt-1"
                th:text="${#numbers.formatInteger(item.priceSnapshot, 0, 'COMMA') + 'đ'}"
              >
                0đ
              </p>
            </div>
          </div>

          <!-- Download + Demo buttons (only for completed orders) -->
          <div th:if="${order.status == 'completed'}" class="px-5 pb-5 space-y-2">
            <a
              th:href="@{/orders/{id}/download(id=${order.id})}"
              target="_blank"
              rel="noopener noreferrer"
              class="w-full flex items-center justify-center gap-2 px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl transition-colors"
            >
              <i class="ph ph-download-simple text-base"></i> Tải về ngay
            </a>
            <a
              th:if="${item.product.demoUrl != null and not #strings.isEmpty(item.product.demoUrl)}"
              th:href="${item.product.demoUrl}"
              target="_blank"
              rel="noopener"
              class="w-full flex items-center justify-center gap-2 px-5 py-2.5 border border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-200 hover:border-gray-400 bg-transparent dark:bg-gray-700/50 text-sm font-medium rounded-xl transition-colors"
            >
              <i class="ph ph-arrow-square-out text-base"></i> Xem demo
            </a>
            <p class="text-xs text-gray-400 flex items-center gap-1 pt-1">
              <i class="ph ph-clock text-xs"></i> Link tải có hiệu lực 24 giờ, chỉ dùng 1 lần.
            </p>
          </div>
        </div>

        <!-- Order metadata -->
        <div
          class="bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl shadow-sm p-5 mb-5"
        >
          <h3 class="text-sm font-semibold text-gray-900 dark:text-white mb-3">
            Chi tiết đơn hàng
          </h3>
          <dl class="space-y-2.5 text-sm">
            <div class="flex items-center justify-between">
              <dt class="text-gray-500 dark:text-gray-400">Mã đơn hàng</dt>
              <dd
                class="font-medium text-gray-900 dark:text-white"
                th:text="'#' + ${order.id}"
              ></dd>
            </div>
            <div class="flex items-center justify-between">
              <dt class="text-gray-500 dark:text-gray-400">Trạng thái</dt>
              <dd>
                <span
                  class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold"
                  th:classappend="${order.status == 'completed'} ? ' bg-green-100 text-green-700' :
                                      (${order.status == 'cancelled'} ? ' bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-400' :
                                      (${order.status == 'refunded'} ? ' bg-blue-100 text-blue-600' : ' bg-yellow-100 text-yellow-700'))"
                  th:text="${order.status == 'completed'} ? 'Hoàn thành' :
                                (${order.status == 'cancelled'} ? 'Đã huỷ' :
                                (${order.status == 'refunded'} ? 'Đã hoàn tiền' : 'Đang xử lý'))"
                >
                  Status
                </span>
              </dd>
            </div>
            <div class="flex items-center justify-between">
              <dt class="text-gray-500 dark:text-gray-400">Phương thức</dt>
              <dd class="font-medium text-gray-900 dark:text-white flex items-center gap-1">
                <i class="ph ph-wallet text-sm text-green-600"></i> Số dư ví
              </dd>
            </div>
            <div
              class="flex items-center justify-between border-t border-gray-50 dark:border-gray-700 pt-2.5"
            >
              <dt class="font-semibold text-gray-900 dark:text-white">Tổng tiền</dt>
              <dd
                class="font-bold text-gray-900 dark:text-white"
                th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA') + 'đ'}"
              >
                0đ
              </dd>
            </div>
            <div class="flex items-center justify-between">
              <dt class="text-gray-500 dark:text-gray-400">Ngày mua</dt>
              <dd
                class="font-medium text-gray-900 dark:text-white"
                th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"
              ></dd>
            </div>
          </dl>
        </div>

        <!-- Footer links -->
        <div class="flex items-center justify-between text-sm">
          <a
            th:href="@{/orders}"
            class="flex items-center gap-1.5 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 transition-colors"
          >
            <i class="ph ph-receipt text-base"></i> Xem tất cả đơn hàng
          </a>
          <a
            th:href="@{/products}"
            class="flex items-center gap-1.5 text-blue-600 hover:text-blue-700 font-medium transition-colors"
          >
            Tiếp tục mua sắm <i class="ph ph-arrow-right text-sm"></i>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>

spring.application.name=EZWeb

# ── Server ───────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:}

# ── DataSource ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:}:${DB_PORT:}/${DB_NAME:}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8

# Buộc JVM dùng cùng timezone với MySQL connection string
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Thymeleaf ────────────────────────────────────────────────────────────
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8

# ── Mail (SMTP) ──────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Session ──────────────────────────────────────────────────────────────
server.servlet.session.timeout=30m

# ── Error handling ──────────────────────────────────────────────────────
spring.web.error.whitelabel.enabled=false

# ── File upload ──────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── App custom properties ────────────────────────────────────────────────
app.name=EZWeb
app.base-url=${APP_BASE_URL:}

# Bank & topup
app.bank.id=${BANK_ID:}
app.bank.account-number=${BANK_ACCOUNT:}
app.bank.account-name=${BANK_OWNER:}

app.topup.provider=${TOPUP_PROVIDER:}
app.topup.prefix=EZW

# Gemini AI
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-3.1-flash-lite

# Download token expiry in hours
app.download.token-ttl-hours=24

# Storage directory for source ZIP files (absolute or relative to working dir)
app.storage.path=${STORAGE_PATH:./storage}

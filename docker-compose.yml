# ============================================================
# EZWeb — Docker Compose
# Deploy trên Raspberry Pi 5 (ARM64)
# Dùng: docker compose up -d
# ============================================================

services:
  # ── MySQL 8 ─────────────────────────────────────────────────
  db:
    image: mysql:8.0 # hỗ trợ ARM64 chính thức
    container_name: ezweb-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-changeme_root}
      MYSQL_DATABASE: ${DB_NAME:-ezweb}
      MYSQL_USER: ${DB_USER:-ezweb}
      MYSQL_PASSWORD: ${DB_PASS:-changeme}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '3306:3306'
    # Tối ưu MySQL cho ARM64 / Raspberry Pi (ít RAM)
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=100
      --skip-name-resolve
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '--password=${DB_ROOT_PASS:-changeme_root}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ezweb-net

  # ── Spring Boot App ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ezweb-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ezweb}
      DB_USER: ${DB_USER:-ezweb}
      DB_PASS: ${DB_PASS:-changeme}
      # Mail
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      # App
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8084}
      APP_NAME: ${APP_NAME:-EZWeb}
      THYMELEAF_CACHE: 'true'
      # Bank
      BANK_ID: ${BANK_ID:-VCB}
      BANK_NAME: ${BANK_NAME:-Vietcombank}
      BANK_ACCOUNT: ${BANK_ACCOUNT:-1234567890}
      BANK_OWNER: ${BANK_OWNER:-TRAN CHI CUONG}
      # Topup
      TOPUP_PROVIDER: ${TOPUP_PROVIDER:-sepay}
      # Gemini AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Storage
      STORAGE_PATH: /app/storage
    ports:
      - '8084:8080'
    volumes:
      - storage_data:/app/storage
    networks:
      - ezweb-net

volumes:
  db_data:
    driver: local
  storage_data:
    driver: local

networks:
  ezweb-net:
    driver: bridge
